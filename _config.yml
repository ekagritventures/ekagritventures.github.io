title: "Ekagrit Ventures"
description: "Tatva’s public research and finance notebook"
url: "https://ekagritventures.github.io"
repository: "ekagritventures/ekagritventures.github.io"
theme: minima
permalink: /:slug/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-mentions
exclude:
  - .obsidian
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - vendor
  - _internal
  - _templates
  - .jekyll-cache
  - .ruby-lsp
  - .DS_Store

collections:
  posts:
    output: true
    permalink: /:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: default

# Google Analytics (replace with your GA4 Measurement ID)
google_analytics: "G-8PRNH9GG8M"

# Email capture (Kit / ConvertKit). Paste the form's HTML action URL here to
# switch the footer subscribe box on; leave empty to hide it entirely.
# Looks like: https://app.kit.com/forms/1234567/subscriptions
kit_form_action: ""


